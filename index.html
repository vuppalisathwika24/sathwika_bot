<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathwika Bot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: #1e293b;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    header {
      padding: 1.25rem 1.5rem;
      background: #334155;
      border-bottom: 1px solid #475569;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #3b82f6;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #334155;
      border-bottom-left-radius: 4px;
    }

    .message.loading {
      color: #94a3b8;
      font-style: italic;
    }

    .input-area {
      padding: 1rem 1.5rem;
      background: #334155;
      border-top: 1px solid #475569;
      display: flex;
      gap: 0.75rem;
    }

    #user-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }

    #user-input:focus {
      border-color: #3b82f6;
    }

    #send-btn {
      padding: 0.75rem 1.25rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
    }

    #send-btn:hover {
      background: #2563eb;
    }

    #send-btn:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .welcome {
      text-align: center;
      color: #94a3b8;
      margin: auto;
      padding: 2rem;
    }

    .welcome h2 {
      color: #e2e8f0;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>
      <h1>Sathwika Bot</h1>
      <p>Powered by Ollama · llama3.2</p>
    </header>

    <div id="messages">
      <div class="welcome">
        <h2>Hello!</h2>
        <p>Ask me anything to get started.</p>
      </div>
    </div>

    <form class="input-area" id="chat-form">
      <input
        type="text"
        id="user-input"
        placeholder="Type your message..."
        autocomplete="off"
        required
      />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    const history = [];

    function addMessage(text, role) {
      const welcome = messagesEl.querySelector(".welcome");
      if (welcome) welcome.remove();

      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      addMessage(text, "user");
      history.push({ role: "user", content: text });

      sendBtn.disabled = true;
      const loading = addMessage("Thinking...", "bot loading");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });

        const data = await res.json();
        loading.remove();

        if (!res.ok) {
          addMessage(data.error || "Something went wrong.", "bot");
          return;
        }

        addMessage(data.reply, "bot");
        history.push({ role: "assistant", content: data.reply });
      } catch {
        loading.remove();
        addMessage("Could not reach the server. Is app.py running?", "bot");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    input.focus();
  </script>
</body>
</html>
